<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" lang="en" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Before and after Caravel</title>
<desc id="dsc">Before: one terminal per agent CLI, switching windows to approve, check progress and review diffs. Now: one Caravel workbench runs tasks in parallel and gathers approvals, input, diff review and merges in one place.</desc>
